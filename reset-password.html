<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | MainTown Realty</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .brand {
      color: #167547;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: 26px;
    }

    .description {
      color: #647084;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #167547;
      border-color: transparent;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #167547;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      display: block;
      background: #fff0f0;
      color: #a12626;
    }

    #message.success {
      display: block;
      background: #eaf8ef;
      color: #12643e;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #167547;
      text-decoration: none;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">MAINTOWN REALTY</div>

    <h1>Reset your password</h1>

    <p class="description">
      Enter a new password for your account. Your password must contain
      at least 8 characters.
    </p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input
        type="password"
        id="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="submitButton" disabled>
        Checking recovery link...
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <a class="back-link" href="/admin.html">
      Return to admin login
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://obtggomfwvravjcnypid.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_GaTnU4FmPc2slbn8BisXXg_DmxH1vl8';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById('resetForm');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const submitButton = document.getElementById('submitButton');
    const message = document.getElementById('message');

    let recoverySessionReady = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function showRecoveryError(text) {
      recoverySessionReady = false;
      form.classList.add('hidden');
      showMessage(text, 'error');
    }

    async function initialiseRecovery() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error || !data.session) {
          showRecoveryError(
            'This recovery link is invalid, expired, or already used. ' +
            'Please request a new password recovery email.'
          );
          return;
        }

        recoverySessionReady = true;
        submitButton.disabled = false;
        submitButton.textContent = 'Save new password';

      } catch (error) {
        showRecoveryError(
          'We could not verify your recovery link. Please request a new one.'
        );
      }
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      if (!recoverySessionReady) {
        showMessage(
          'Your recovery session is not ready. Please open a valid recovery link.',
          'error'
        );
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (password.length < 8) {
        showMessage(
          'Your password must contain at least 8 characters.',
          'error'
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          'The passwords do not match. Please check them.',
          'error'
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating password...';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) {
          showMessage(
            'Password update failed: ' + error.message,
            'error'
          );

          submitButton.disabled = false;
          submitButton.textContent = 'Save new password';
          return;
        }

        recoverySessionReady = false;
        form.classList.add('hidden');

        showMessage(
          'Your password has been changed successfully. ' +
          'You can now return to the admin login and sign in with your new password.',
          'success'
        );

        await supabaseClient.auth.signOut();

      } catch (error) {
        showMessage(
          'Something went wrong. Please try again or request a new recovery link.',
          'error'
        );

        submitButton.disabled = false;
        submitButton.textContent = 'Save new password';
      }
    });

    initialiseRecovery();
  </script>
</body>
</html>
