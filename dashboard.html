<style>
  /* ------------------------------------------------------------------
     Design tokens: same charcoal + violet language as the website.
     Light mode follows html[data-theme="light"] (set by theme.js / the footer switcher).
     ------------------------------------------------------------------ */
  :root {
    --bg: #0E0E10; --bg-2: #08080A; --panel: #151518; --panel-2: #1C1C20; --line: #2A2A30; --line-soft: rgba(255,255,255,.06);
    --fg: #F4F4F5; --fg-2: #D4D4D8; --muted: #A1A1AA; --faint: #71717A;
    --brand: #7C3AED; --brand-2: #8B5CF6; --brand-soft: rgba(124,58,237,.14); --brand-text: #C4B5FD;
    --ok: #34D399; --ok-soft: rgba(52,211,153,.12); --warn: #FBBF24; --warn-soft: rgba(251,191,36,.12);
    --bad: #F87171; --bad-soft: rgba(248,113,113,.12); --info: #60A5FA; --info-soft: rgba(96,165,250,.12);
    --shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  html[data-theme="light"] {
    --bg: #F6F6F8; --bg-2: #EDEDF1; --panel: #FFFFFF; --panel-2: #F4F4F7; --line: #E3E3E8; --line-soft: rgba(0,0,0,.06);
    --fg: #0E0E10; --fg-2: #27272A; --muted: #52525B; --faint: #71717A;
    --brand-soft: rgba(124,58,237,.09); --brand-text: #6D28D9;
    --ok: #059669; --ok-soft: rgba(5,150,105,.1); --warn: #B45309; --warn-soft: rgba(180,83,9,.1);
    --bad: #DC2626; --bad-soft: rgba(220,38,38,.08); --info: #2563EB; --info-soft: rgba(37,99,235,.09);
    --shadow: 0 18px 40px rgba(15,23,42,.14);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
  h1, h2, h3, h4 { font-family: "Space Grotesk", Inter, sans-serif; margin: 0; letter-spacing: -.01em; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.lucide { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 40; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
  .brand { display: flex; align-items: center; gap: 9px; font: 800 17px "Space Grotesk", Inter, sans-serif; letter-spacing: -.02em; }
  .brand img { width: 30px; height: 30px; border-radius: 9px; }
  .brand b { color: var(--brand-2); font-weight: 800; }
  .tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .tb-page { color: var(--muted); font-weight: 500; }
  .tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn { position: relative; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg-2); }
  .icon-btn:hover { background: var(--panel-2); }
  .count-dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: #EF4444; color: #fff; font: 700 10.5px/18px Inter; text-align: center; border: 2px solid var(--bg); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; font: 700 15px Inter; overflow: hidden; padding: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .menu-toggle { display: none; }
  .acct-menu { position: absolute; right: 0; top: 46px; width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; }
  .acct-menu p { margin: 0; }
  .acct-menu .row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 6px; border: 0; background: none; border-radius: 8px; text-align: left; color: var(--fg-2); }
  .acct-menu .row:hover { background: var(--panel-2); }

  /* ---------- shell ---------- */
  .shell { flex: 1; display: grid; grid-template-columns: 248px minmax(0, 1fr); max-width: 1480px; width: 100%; margin: 0 auto; }
  .side { position: sticky; top: 60px; align-self: start; height: calc(100vh - 60px); overflow-y: auto; padding: 18px 12px 24px 16px; border-right: 1px solid var(--line-soft); }
  .side .role-chip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 14px; border-radius: 12px; background: var(--brand-soft); border: 1px solid rgba(124,58,237,.28); }
  .role-chip small { display: block; color: var(--brand-text); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .role-chip strong { display: block; font-size: 13.5px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-group { margin: 16px 10px 6px; font: 600 10.5px Inter; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--muted); font-weight: 500; margin-bottom: 1px; }
  .nav a:hover { background: var(--panel); color: var(--fg); }
  .nav a.on { background: var(--panel-2); color: var(--fg); box-shadow: inset 2px 0 0 var(--brand-2); }
  .nav a .n { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--brand); color: #fff; font: 700 11px/20px Inter; text-align: center; }
  .nav a .n.warn { background: var(--warn); color: #1c1400; }
  .main { padding: 26px 28px 56px; min-width: 0; }
  .scrim { display: none; }

  /* ---------- building blocks ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head h1 { font-size: 26px; font-weight: 700; }
  .page-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 8px 20px rgba(124,58,237,.25); }
  .btn.primary:hover { background: #6D28D9; }
  .btn.ok { background: var(--ok-soft); border-color: rgba(52,211,153,.35); color: var(--ok); }
  .btn.bad { background: var(--bad-soft); border-color: rgba(248,113,113,.35); color: var(--bad); }
  .btn.sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 16px; }
  .card.pad { padding: 18px; }
  .card h3 { font-size: 15px; font-weight: 600; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
  .card-head p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .grid { display: grid; gap: 16px; }
  .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .split.rev { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 99px; font: 600 11px Inter; letter-spacing: .02em; border: 1px solid transparent; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(52,211,153,.25); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: rgba(251,191,36,.25); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(248,113,113,.25); }
  .pill.info { background: var(--info-soft); color: var(--info); border-color: rgba(96,165,250,.25); }
  .pill.brand { background: var(--brand-soft); color: var(--brand-text); border-color: rgba(124,58,237,.3); }
  .pill.mute { background: var(--panel-2); color: var(--muted); border-color: var(--line); }
  .empty { padding: 38px 20px; text-align: center; color: var(--muted); }
  .empty svg { width: 30px; height: 30px; color: var(--faint); margin-bottom: 8px; }
  .empty b { display: block; color: var(--fg-2); font-size: 14px; margin-bottom: 3px; }
  .notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--info-soft); border: 1px solid rgba(96,165,250,.25); color: var(--fg-2); font-size: 12.5px; margin-bottom: 16px; }
  .notice.warn { background: var(--warn-soft); border-color: rgba(251,191,36,.3); }
  .notice svg { margin-top: 2px; color: var(--info); }
  .notice.warn svg { color: var(--warn); }

  /* hero earnings card */
  .hero { position: relative; overflow: hidden; padding: 24px; border-radius: 18px; border: 1px solid rgba(124,58,237,.35); background: linear-gradient(135deg, rgba(124,58,237,.2), rgba(124,58,237,.04) 60%), var(--panel); }
  .hero small { color: var(--brand-text); font: 600 11px Inter; letter-spacing: .1em; text-transform: uppercase; }
  .hero .big { font: 700 38px "Space Grotesk"; letter-spacing: -.02em; margin: 6px 0 2px; }
  .hero p { margin: 0; color: var(--muted); }
  .hero .btn { margin-top: 16px; }
  .stat { padding: 16px 18px; }
  .stat small { display: flex; align-items: center; gap: 7px; color: var(--muted); font-weight: 500; }
  .stat b { display: block; font: 700 26px "Space Grotesk"; margin-top: 6px; }
  .stat span { color: var(--faint); font-size: 12px; }

  /* quick actions */
  .qa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .qa button { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 14px; text-align: left; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px; }
  .qa button:hover { border-color: rgba(124,58,237,.5); transform: translateY(-1px); }
  .qa .ic { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: var(--brand-soft); color: var(--brand-text); }
  .qa .ic svg { width: 19px; height: 19px; }
  .qa b { font-weight: 600; font-size: 13.5px; }
  .qa .n { position: absolute; top: 10px; right: 10px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--brand); color: #fff; font: 700 11px/20px Inter; text-align: center; }

  /* attention list + rows */
  .rows { display: flex; flex-direction: column; }
  .row-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--line-soft); }
  .row-item:first-child { border-top: 0; }
  .row-item .lead { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); color: var(--muted); flex: none; }
  .row-item .lead.warn { background: var(--warn-soft); color: var(--warn); }
  .row-item .lead.ok { background: var(--ok-soft); color: var(--ok); }
  .row-item .lead.brand { background: var(--brand-soft); color: var(--brand-text); }
  .row-item .grow { flex: 1; min-width: 0; }
  .row-item .t { font-weight: 600; }
  .row-item .s { color: var(--muted); font-size: 12.5px; }
  .row-item .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .row-item.unread { background: color-mix(in srgb, var(--brand) 7%, transparent); }

  /* tables */
  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; padding: 11px 18px; font: 600 11px Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .tbl td { padding: 14px 18px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr:hover td { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl .sub { color: var(--muted); font-size: 12px; }
  .tbl .thumb { width: 54px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--panel-2); flex: none; }
  .tbl .who { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line-soft); width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 16px; }
  .tabs button { height: 32px; padding: 0 13px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .tabs button.on { background: var(--brand); color: #fff; }
  .tabs button i { font-style: normal; opacity: .75; margin-left: 5px; }

  /* breakdown */
  .bd { padding: 4px 18px 16px; display: none; }
  .bd.open { display: block; }
  .bd div { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); border-bottom: 1px dashed var(--line); }
  .bd div:last-child { border: 0; color: var(--fg); font-weight: 700; }

  /* progress bar */
  .bar { height: 6px; border-radius: 9px; background: var(--panel-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand-2); border-radius: 9px; }

  /* modal */
  .modal-wrap { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.62); backdrop-filter: blur(4px); }
  .modal { width: 100%; max-width: 560px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
  .modal.wide { max-width: 760px; }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; }
  .modal-head h3 { font-size: 18px; }
  .modal-head p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
  .modal-body { padding: 4px 20px 18px; overflow-y: auto; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line-soft); }

  /* forms */
  .f { display: grid; gap: 14px; }
  .f-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label.fld { display: block; font-weight: 600; font-size: 12.5px; color: var(--fg-2); }
  label.fld span.hint { font-weight: 400; color: var(--faint); }
  .in { display: block; width: 100%; height: 42px; margin-top: 6px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 14px Inter; }
  textarea.in { height: 84px; padding: 10px 12px; resize: vertical; }
  .in:focus { outline: 2px solid rgba(124,58,237,.55); outline-offset: 1px; border-color: transparent; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .seg button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-weight: 600; font-size: 13px; }
  .seg button.on { border-color: var(--brand-2); background: var(--brand-soft); color: var(--fg); }
  .steps { display: flex; gap: 8px; margin-bottom: 14px; }
  .steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .steps span.on { background: var(--brand-2); }
  .policy-box { max-height: 240px; overflow-y: auto; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 12.5px; color: var(--muted); }
  .policy-box h4 { font-size: 12.5px; color: var(--fg); margin: 10px 0 3px; font-family: Inter; }
  .policy-box h4:first-child { margin-top: 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--fg-2); margin-top: 12px; }
  .check input { margin-top: 3px; accent-color: var(--brand); width: 16px; height: 16px; }

  /* chat */
  .chat { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding: 6px 0 10px; }
  .bub { max-width: 82%; padding: 9px 12px; border-radius: 14px; background: var(--panel-2); font-size: 13px; }
  .bub.me { align-self: flex-end; background: var(--brand); color: #fff; }
  .bub small { display: block; opacity: .7; font-size: 10.5px; margin-top: 3px; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 120; max-width: 92vw; padding: 11px 16px; border-radius: 99px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 13px; box-shadow: var(--shadow); }
  .demo-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid rgba(251,191,36,.25); font-weight: 600; font-size: 12.5px; text-align: center; }
  .demo-bar a { text-decoration: underline; }
  .gate { max-width: 560px; margin: 8vh auto; padding: 0 16px; }
  .gate .card { padding: 30px; text-align: center; }
  .gate h2 { font-size: 24px; margin: 12px 0 6px; }
  .gate p { color: var(--muted); margin: 0 0 18px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) { .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .qa { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .menu-toggle { display: inline-flex; }
    .tb-page, .tb-sep { display: none; }
    .side { position: fixed; z-index: 70; top: 0; left: 0; bottom: 0; width: 280px; height: auto; background: var(--bg); transform: translateX(-102%); transition: transform .25s ease; padding-top: 74px; border-right: 1px solid var(--line); }
    body.nav-open .side { transform: none; }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); }
    .main { padding: 20px 16px 48px; }
    .g-2, .g-3, .split, .split.rev { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .qa { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g-4 { grid-template-columns: 1fr 1fr; gap: 10px; }
    .page-head h1 { font-size: 22px; }
    .hero .big { font-size: 30px; }
    .f-2 { grid-template-columns: 1fr; }
    .row-item { flex-wrap: wrap; }
    .row-item .acts { width: 100%; justify-content: flex-start; padding-left: 50px; }
    .modal-wrap { align-items: flex-end; padding: 0; }
    .modal { max-width: none; border-radius: 18px 18px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
  // ---- Stay signed in: one shared helper (same code in the landing page, sign-up page and dashboard) ----
  function mtHasStoredSession() { try { return Object.keys(localStorage).some(k => /^sb-.*-auth-token$/.test(k) && localStorage.getItem(k)); } catch (e) { return false; } }
  async function mtGetSession(client) {
    for (let i = 0; i < 3; i++) {
      try {
        const r = await client.auth.getSession();
        if (r.data && r.data.session) return r.data.session;
        if (!mtHasStoredSession()) return null;                       // genuinely signed out
        const rr = await client.auth.refreshSession();                 // expired while the tab slept: renew it
        if (rr.data && rr.data.session) return rr.data.session;
      } catch (e) {}
      if (!mtHasStoredSession()) return null;
      await new Promise(res => setTimeout(res, 700 * (i + 1)));       // brief network drop: try again before giving up
    }
    return null;
  }
  function mtKeepAlive(client, onBack) {
    const wake = () => { try { client.auth.startAutoRefresh(); } catch (e) {} mtGetSession(client).then(s => { if (s && onBack) onBack(s); }); };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
    window.addEventListener('online', wake); window.addEventListener('pageshow', e => { if (e.persisted) wake(); });
    setInterval(() => { if (document.visibilityState === 'visible') mtGetSession(client); }, 10 * 60 * 1000);

  function split(kind, amount, agentListed) {
    amount = Number(amount) || 0;
    if (kind === 'land') {
      const sellerFee = amount * 0.05;
      return { fee: sellerFee, feeLabel: "Seller's 5% commission", agent: agentListed ? sellerFee : 0, mt: agentListed ? 0 : sellerFee, net: amount - sellerFee };
    }
    const fee = amount * 0.10;
    return { fee, feeLabel: 'Platform commission (10%)', agent: agentListed ? fee * 0.6 : 0, mt: agentListed ? fee * 0.4 : fee, net: amount - fee };

  function parseCSV(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
      else cur += ch;
    }
    row.push(cur); if (row.some(x => x.trim())) rows.push(row); return rows;
  }

        sel('lfLegal', 'Deed of Assignment legal fee (paid to the owner)', ['5%', '10%']);
      lbl.textContent = 'Outright price (₦)';
    }
    if (c === 'rent' || c === 'commercial') h += '<div class="f-2">' + num('lfUnits', 'Units available in this building (optional)', 'e.g. 5') + '</div><p class="hint" style="margin:-4px 0 0">If you have several identical units, enter how many are still available. We show it on the listing.</p>';
    if (c === 'land' && LF.kind !== 'House / Building') h += '<div class="f-2">' + num('lfPlots', 'Plots available (optional)', 'e.g. 10') + '</div><p class="hint" style="margin:-4px 0 0">How many plots you are selling in this estate or layout.</p>';
    el.innerHTML = '<div class="f">' + h + '</div>'; LF.unit = { rent: 'mo', shortlet: 'night', commercial: 'yr', event: 'hr', land: 'total' }[c];
    const hint = $('#lfDocHint'); if (hint) hint.textContent = c === 'land' ? '(required: C of O, Deed, Survey or other title. PDF or photo, shown only to MainTown’s legal team)' : '(required: proof you own or manage the property. PDF or photo, shown only to MainTown’s legal team)';
  }

  // Builds the exact text format admin.html uses (rent text, fees lines), so the listing looks right on the public site.
  const n$ = x => '₦' + Math.round(Number(x)).toLocaleString('en-US');
  const int = id => { const e = $('#' + id); const v = e ? parseInt(String(e.value).replace(/[^\d]/g, ''), 10) : NaN; return isNaN(v) ? 0 : v; };
  const txt = id => { const e = $('#' + id); return e ? e.value.trim() : ''; };
  function buildFormat() {
    const c = LF.cat, price = int('lfPrice'), fees = []; let rent = '', annual = null, beds = 0, db = c;
    if (!price) return { err: 'Enter a valid price.' };
    if (c === 'rent') {
      beds = int('lfBeds'); rent = n$(price) + '/mo'; annual = int('lfAnnual') || null;
      if (int('lfCaution')) fees.push('Caution Fee: ' + n$(int('lfCaution')));
      if (int('lfSvc')) fees.push('Service Charge: ' + n$(int('lfSvc')) + '/' + txt('lfSvcFreq'));
    } else if (c === 'commercial') {
      db = 'rent'; rent = n$(price) + '/yr'; annual = price;
      fees.push('Usage: Commercial', 'Commercial Type: ' + txt('lfCType'));
      const sq = parseFloat(txt('lfSqm')); if (sq > 0) fees.push('Commercial Size: ' + sq + ' sqm');
      if ($('#lfPark').value !== '') fees.push('Commercial Parking: ' + int('lfPark'));
      fees.push('Power Supply: ' + txt('lfPower'), 'Payment Terms: Annual, paid in full upfront');
    } else if (c === 'shortlet') {
      db = 'short-let'; beds = int('lfBeds'); rent = n$(price) + '/night';
      if (int('lfMinStay')) fees.push('Minimum Stay: ' + int('lfMinStay') + ' night' + (int('lfMinStay') > 1 ? 's' : ''));
      if (int('lfClean')) fees.push('Cleaning Fee: ' + n$(int('lfClean')));
      if (int('lfCaution')) fees.push('Caution Fee: ' + n$(int('lfCaution')));
      const ab = txt('lfDesc').replace(/\s+/g, ' '); if (ab) fees.push('About This Space: ' + ab);
    } else if (c === 'event') {
      db = 'event-center'; rent = n$(price) + '/hour';
      if (int('lfCap') < 1) return { err: 'Enter the maximum number of guests.' };
      fees.push('Price Per Hour: ' + n$(price), 'Venue Type: ' + txt('lfVenue'), 'Capacity: ' + int('lfCap') + ' guests');
      if ($('#lfPark').value !== '') fees.push('Parking Spaces: ' + int('lfPark'));
      fees.push('Power Supply: ' + txt('lfPower'), 'MainTown Service Charge: 2% of hire fee (paid by the booker)');
      const ab = txt('lfDesc').replace(/\s+/g, ' '); if (ab) fees.push('About This Venue: ' + ab);
    } else if (c === 'land') {
      db = 'land'; rent = n$(price); const house = LF.kind === 'House / Building';
      const inst = $('#lfInst') && $('#lfInst').checked, ip = int('lfInstPrice'), im = int('lfInstMonths') || 12, idp = int('lfInstDep');
      if (inst && !ip) return { err: 'Enter the installment price, or untick the installment plan.' };
      if (inst && ip < price) return { err: 'The installment price cannot be lower than the outright price.' };
      if (inst && idp >= ip) return { err: 'The initial deposit must be less than the installment price.' };
      if (house) { beds = int('lfBeds'); if (int('lfBaths')) fees.push('Bathrooms: ' + int('lfBaths')); if (int('lfToilets')) fees.push('Toilets: ' + int('lfToilets')); if ($('#lfPark').value !== '') fees.push('Parking Spaces: ' + int('lfPark')); }
      fees.push('Property Type: ' + (house ? txt('lfHType') : 'Land (Plot)'), 'Outright Price: ' + n$(price));
      if (inst) { fees.push('Installment Price: ' + n$(ip), 'Installment Duration: ' + im + ' months'); if (idp) fees.push('Initial Deposit: ' + n$(idp)); }
      const pct = parseInt(txt('lfLegal'), 10) || 5; fees.push('Legal Fee: ' + pct + '% (' + n$(price * pct / 100) + ')');
      if (txt('lfPlot')) fees.push('Plot Size: ' + txt('lfPlot'));
      fees.push('Title Document: ' + txt('lfTitleDoc'), 'Land Use: ' + txt('lfUse'));
      if (!house && int('lfPlots') > 1) fees.push('Plots Available: ' + int('lfPlots'));
    }
    if ((c === 'rent' || c === 'commercial') && int('lfUnits') > 1) fees.push('Units Available: ' + int('lfUnits'));
    return { rent, annual, beds, fees, db };
  }

  // Shrinks a photo in the browser before upload (same idea as the admin panel): max 1600px, JPEG.
  function compressImage(file) {
    return new Promise(res => {
      if (!/^image\//.test(file.type) || file.size < 400 * 1024) return res(file);
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u); cv.toBlob(b => res(b ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.82); };
      img.onerror = () => { URL.revokeObjectURL(u); res(file); }; img.src = u;
    });
  }
  const safeName = n => String(n).replace(/[^a-zA-Z0-9.\-_]/g, '-').slice(-80);

  async function submitListing() {
    const title = txt('lfTitle');
    if (title.length < 4) return toast('Add a title for the listing.');
    const f = buildFormat(); if (f.err) return toast(f.err);
    if (isAgent() && (txt('lfLName').length < 2 || txt('lfLPhone').replace(/\D/g, '').length < 10)) return toast('Add the landlord’s name and phone number.');
    const photos = Array.from($('#lfPhotos').files || []), docs = Array.from($('#lfDocs').files || []), vid = ($('#lfVideoFile').files || [])[0];
    if (!docs.length) return toast('Upload at least one title or ownership document. MainTown’s legal team needs it before your listing can be reviewed.');
    if (photos.length > 12) return toast('Choose up to 12 photos.');
    if (vid && vid.size > 100 * 1024 * 1024) return toast('The video is over 100 MB. Choose a shorter clip.');
    const area = (txt('lfArea') === 'Other' ? '' : txt('lfArea') + ', ') + txt('lfCity');
    const btn = $('[data-act="lf-submit"]'), setBusy = m => { if (btn) { btn.disabled = !!m; btn.textContent = m || (isAgent() ? 'Submit for review' : 'Submit for review'); } };

    if (!IS_DEMO) {
      // Real account: photos/docs go to storage, then ONE call creates the listing as "pending" for admin approval.
      try {
        const uid = USER.id, stamp = Date.now(), images = [], documents = []; let video = null;
        for (let i = 0; i < photos.length; i++) { setBusy('Uploading photo ' + (i + 1) + ' of ' + photos.length + '…'); const ph = await compressImage(photos[i]), path = 'host/' + uid + '/' + stamp + '-' + i + '-' + safeName(ph.name); const up = await sb.storage.from('listing-media').upload(path, ph, { cacheControl: '31536000', upsert: false }); if (up.error) throw up.error; images.push(sb.storage.from('listing-media').getPublicUrl(path).data.publicUrl); }
        if (vid) { setBusy('Uploading video…'); const path = 'host/' + uid + '/' + stamp + '-v-' + safeName(vid.name); const up = await sb.storage.from('listing-media').upload(path, vid, { cacheControl: '31536000', upsert: false }); if (up.error) throw up.error; video = sb.storage.from('listing-media').getPublicUrl(path).data.publicUrl; }
        for (let i = 0; i < docs.length; i++) { setBusy('Uploading document ' + (i + 1) + ' of ' + docs.length + '…'); const path = uid + '/' + stamp + '-d' + i + '-' + safeName(docs[i].name); const up = await sb.storage.from('listing-docs').upload(path, docs[i], { upsert: false }); if (up.error) throw up.error; documents.push({ label: LF.cat === 'land' ? 'Title / ownership document' : 'Ownership document', name: docs[i].name, path, kind: 'document' }); }
        setBusy('Submitting…');
        const host = isAgent() ? { name: txt('lfLName'), phone: txt('lfLPhone'), email: txt('lfLEmail') } : { name: S.profile.name, phone: '', email: S.profile.email };
        const r = await sb.rpc('dashboard_submit_listing', { p: { category: f.db, title, location: area, city: txt('lfCity'), beds: f.beds, rent: f.rent, annual_rent: f.annual, fees: f.fees, features: [], images, video, documents, host } });
        if (r.error) throw r.error;
        closeModal(); toast('Submitted. It goes live once MainTown approves it.'); await Api.load(); TAB.listings = 'pending'; go('listings'); rerender(); refreshNav();
      } catch (e) { setBusy(null); toast('Could not submit: ' + (e && e.message ? e.message : 'please try again')); }
      return;
    }
    // Sample preview: local only
    const l = { id: 'L' + Date.now(), title, category: LF.cat, area, price: int('lfPrice'), unit: LF.unit === 'hr' ? 'night' : LF.unit, status: isAgent() ? 'Pending Verification' : 'Under Review', agentListed: isAgent(), agentName: isAgent() ? S.profile.name : '', ownerName: isAgent() ? txt('lfLName') : S.profile.name, img: '' };
    if (LF.cat === 'land') { l.kind = LF.kind; if (LF.kind === 'House / Building') l.houseType = txt('lfHType'); }
    S.listings.unshift(l); S.notifications.unshift({ id: 'N' + Date.now(), title: 'Listing submitted', body: title + (isAgent() ? ' is waiting for the landlord’s verification.' : ' is with MainTown for review.'), ts: Date.now(), unread: true, route: 'listings' });
    closeModal(); toast('Listing submitted.'); TAB.listings = 'pending'; go('listings'); rerender(); refreshNav();
  }

  document.addEventListener('change', async e => {
    if (!e.target || e.target.id !== 'pfPhoto') return;
    const file = (e.target.files || [])[0]; if (!file) return;
    if (!/^image\//.test(file.type)) return toast('Choose a photo (JPG or PNG).');
    try {
      const small = await new Promise((res, rej) => { const im = new Image(), u = URL.createObjectURL(file); im.onload = () => { const k = Math.min(1, 400 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u); cv.toBlob(b => b ? res(b) : rej(new Error('Could not read that image.')), 'image/jpeg', 0.82); }; im.onerror = () => rej(new Error('Could not read that image.')); im.src = u; });
      if (IS_DEMO) { S.profile.avatar = URL.createObjectURL(small); toast('Photo updated (sample preview).'); rerender(); refreshNav(); return; }

      const bank = ($('#bkName').value || '').trim(), num = ($('#bkNum').value || '').replace(/\D/g, '');
      if (bank.length < 2) return toast('Enter your bank name.'); if (num.length !== 10) return toast('Enter the 10-digit account number.');
      if (IS_DEMO) { S.profile.bank = bank + ' •• ' + num.slice(-4); S.profile.payoutAcct = { bank_name: bank, account_number: num }; closeModal(); toast('Saved (sample preview).'); rerender(); return; }
      try { const r = await sb.rpc('save_my_payout_account', { p_bank: bank, p_number: num, p_name: S.profile.name || null }); if (r.error) throw r.error;
        S.profile.payoutAcct = { bank_name: bank, account_number: num }; S.profile.bank = bank + ' •• ' + num.slice(-4); closeModal(); toast('Saved. The app will use the same account.'); rerender();
      } catch (e) { toast('Could not save: ' + (e && e.message ? e.message : 'please try again')); }
    },
    'prof-save': async () => {
      const name = ($('#pfName').value || '').trim(), phone = ($('#pfPhone').value || '').trim();
      if (name.length < 2) return toast('Enter your full name.');
      if (phone && !/^[0-9+() \-]{7,30}$/.test(phone)) return toast('Enter a valid phone number.');
      if (IS_DEMO) { S.profile.name = name; S.profile.phone = phone; closeModal(); toast('Saved (sample preview).'); renderChrome(); rerender(); return; }
      try {
        const r = await sb.rpc('sync_my_profile', { p_avatar_url: null, p_phone: phone || null, p_name: name }); if (r.error) throw r.error;
        S.profile.name = name; if (phone) S.profile.phone = phone; PROFILE.name = name; if (phone) PROFILE.phone = phone;
        try { const c = JSON.parse(localStorage.getItem('mt_member_cache') || '{}'); c.name = name; localStorage.setItem('mt_member_cache', JSON.stringify(c)); } catch (e2) {}
        closeModal(); toast('Saved. The app will show the same details.'); renderChrome(); rerender();
      } catch (e) { toast('Could not save: ' + (e && e.message ? e.message : 'please try again')); }
    },
    'partner-open': () => { const c = (window.MT_CONTENT || {}).partner, k = isAgent() ? 'agent' : 'landlord'; if (!c) return; modal({ title: 'Partnership benefits & terms', sub: isAgent() ? 'Real Estate Agent / Broker' : 'Landlord / Property Owner', body: partnerHtml(k), foot: '<button class="btn primary" data-act="modal-close">Close</button>' }); },
    'photo-pick': () => { const f = $('#pfPhoto'); if (f) f.click(); },
    'del-listing': id => { const l = getL(id); if (!l || l.status !== 'Live') return; modal({ title: 'Delete this listing?', sub: l.title, body: '<p style="color:var(--muted);margin:0">It will be removed from the site. You can only delete a listing while it is live and nobody has paid.</p>', foot: '<button class="btn" data-act="modal-close">Keep it</button><button class="btn bad" data-act="del-confirm" data-id="' + id + '">Delete listing</button>' }); },
    'del-confirm': async id => {
      if (IS_DEMO) { S.listings = S.listings.filter(l => l.id !== id); closeModal(); toast('Listing deleted.'); return rerender(); }
      try { const r = await sb.rpc('dashboard_delete_listing', { p_id: id }); if (r.error) throw r.error; if (!r.data) { closeModal(); return toast('It can’t be deleted now. Only live listings with no payment in progress can be removed.'); } await Api.load(); closeModal(); toast('Listing deleted.'); rerender(); }
      catch (e) { toast('Could not delete: ' + (e && e.message || 'try again')); }
    },
    'verify-open': id => { const l = getL(id); if (!l) return; modal({ title: 'Verify this listing', sub: 'Submitted by ' + (l.agentName || 'your agent'), body: '<div class="card pad"><b>' + esc(l.title) + '</b><div style="color:var(--muted);margin-top:4px">' + esc(l.area) + ' · ' + CAT[l.category] + '</div><div style="font:700 22px Space Grotesk;margin-top:8px">' + money(l.price) + ' <span style="font:500 13px Inter;color:var(--muted)">' + UNIT[l.unit] + '</span></div></div><p style="color:var(--muted);font-size:12.5px;margin:12px 0">Confirm you own this property, the price is right and the agent may list it for you. Then add a document that proves it. MainTown’s legal team reviews it next, and it only goes live once they approve it.</p><label class="fld">Proof of ownership <b style="color:var(--bad,#dc2626)">*</b> <span class="hint">(C of O, deed, survey, tenancy or allocation papers. PDF or photo. Shown only to MainTown’s legal team)</span><input type="file" id="vfDocs" accept=".pdf,image/*" multiple></label><label class="fld" style="margin-top:10px">If declining, tell us why <span class="hint">(optional)</span><input class="in" id="vfReason" placeholder="e.g. This is not my property"></label>', foot: '<button class="btn bad" data-act="verify-decline" data-id="' + id + '">Decline</button><button class="btn primary" data-act="verify-ok" data-id="' + id + '">Yes, verify</button>' }); },
    'verify-ok': async id => {
      const l = getL(id); if (!l) return;
      if (IS_DEMO) { l.status = 'Under Review'; addNotif('Listing verified', l.title + ' is now with MainTown for review.', 'listings'); closeModal(); toast('Verified. Sent to MainTown review.'); rerender(); return; }
      const files = Array.from(($('#vfDocs') || {}).files || []); if (!files.length) return toast('Add at least one document that proves you own this property.');
      const btn = $('[data-act="verify-ok"]'); if (btn) { btn.disabled = true; btn.textContent = 'Uploading…'; }
      try {
        const uid = USER.id, stamp = Date.now(), documents = [];
        for (let i = 0; i < files.length; i++) { const path = uid + '/' + stamp + '-v' + i + '-' + safeName(files[i].name); const up = await sb.storage.from('listing-docs').upload(path, files[i], { upsert: false }); if (up.error) throw up.error; documents.push({ name: files[i].name, path }); }
        const r = await sb.rpc('dashboard_landlord_verify_listing', { p_listing_id: String(id), p_confirm: true, p_documents: documents, p_reason: null }); if (r.error) throw r.error;
        closeModal(); toast('Verified. It is now with MainTown’s legal team.'); await Api.load(); TAB.listings = 'pending'; rerender(); refreshNav();
      } catch (e) { if (btn) { btn.disabled = false; btn.textContent = 'Yes, verify'; } toast('Could not verify: ' + (e && e.message ? e.message : 'please try again')); }
    },
    'verify-decline': async id => {
      const l = getL(id); if (!l) return;
      if (IS_DEMO) { l.status = 'Declined'; closeModal(); toast('Listing declined.'); rerender(); return; }
      try { const r = await sb.rpc('dashboard_landlord_verify_listing', { p_listing_id: String(id), p_confirm: false, p_documents: [], p_reason: ($('#vfReason') || {}).value || null }); if (r.error) throw r.error; closeModal(); toast('Listing declined. The agent is told it was not confirmed.'); await Api.load(); rerender(); refreshNav(); }
      catch (e) { toast('Could not decline: ' + (e && e.message ? e.message : 'please try again')); }
    },
    'insp-confirm': async id => {
      const i = getI(id);
      if (IS_DEMO) { i.status = 'Confirmed'; addNotif('Inspection confirmed', i.person + ' · ' + i.listingTitle, 'inspections'); toast('Confirmed. Chat is now open.'); rerender(); return; }
      if (!S.inspectionsLive) return Api.need();
      try { const r = await sb.rpc('dashboard_decide_inspection', { p_entity: id, p_decision: 'confirm' }); if (r.error) throw r.error; i.status = 'Confirmed'; toast('Confirmed. It will show in your app too.'); rerender(); }
      catch (e) { toast('Could not confirm: ' + (e && e.message || 'try again')); }
    },
    'insp-decline': async id => {
      const i = getI(id);
      if (IS_DEMO) { i.status = 'Declined'; toast('Request declined.'); rerender(); return; }
      if (!S.inspectionsLive) return Api.need();
      try { const r = await sb.rpc('dashboard_decide_inspection', { p_entity: id, p_decision: 'decline' }); if (r.error) throw r.error; i.status = 'Declined'; toast('Request declined.'); rerender(); }
      catch (e) { toast('Could not decline: ' + (e && e.message || 'try again')); }
    },
    'insp-done': async id => {
      const i = getI(id); if (!i) return;
      if (IS_DEMO) { i.status = 'Conducted'; toast('Marked as conducted.'); rerender(); return; }
      if (!S.inspectionsLive) return toast(NOT_CONNECTED);
      try { const r = await sb.rpc('dashboard_decide_inspection', { p_entity: id, p_decision: 'conducted' }); if (r.error) throw r.error; i.status = 'Conducted'; toast('Marked as conducted. The app shows it too.'); rerender(); refreshNav(); }
      catch (e) { toast('Could not update: ' + (e && e.message ? e.message : 'please try again')); }
    },
    'insp-chat': id => openChat('i:' + id, getI(id).person, getI(id).listingTitle),
    'book-chat': id => { const b = S.bookings.find(x => x.id === id); openChat('b:' + id, b.guest, b.listingTitle); },
    'book-cancel': id => { const b = S.bookings.find(x => x.id === id); modal({ title: 'Cancel this booking?', sub: b.guest + ' · ' + fmtDate(b.checkIn) + ' → ' + fmtDate(b.checkOut), body: '<p style="color:var(--muted);margin:0">Only possible before check-in. The guest is refunded and the dates open up again. Cancelling often can affect your listing’s standing.</p>', foot: '<button class="btn" data-act="modal-close">Keep booking</button><button class="btn bad" data-act="book-cancel-ok" data-id="' + id + '">Cancel booking</button>' }); },
    'book-cancel-ok': async id => {
      const b = S.bookings.find(x => x.id === id);
      if (IS_DEMO) { b.status = 'CANCELLED_BY_HOST'; closeModal(); toast('Booking cancelled.'); rerender(); return; }
      try { const r = await sb.rpc('dashboard_request_booking_cancel', { p_id: String(id) }); if (r.error) throw r.error; b.cancelPending = true; closeModal(); toast('Cancellation sent. The guest is refunded and the dates reopen as soon as their app confirms.'); rerender(); }
      catch (e) { toast((e && e.message) || 'Could not cancel. Please try again.'); }
    },
    'book-view': id => { const b = S.bookings.find(x => x.id === id), ph = phase(b); modal({ title: 'Booking details', sub: b.listingTitle, body: '<div class="rows">' + [['Guest', b.guest], ['Status', ph.label], ['Check-in', fmtDate(b.checkIn)], ['Check-out', fmtDate(b.checkOut)], ['Nights', nightsOf(b)], ['Total paid', money(b.total)]].map(r => '<div class="row-item" style="padding:10px 0"><div class="grow s">' + r[0] + '</div><b style="font-weight:600">' + esc(r[1]) + '</b></div>').join('') + '</div>', foot: '<button class="btn primary" data-act="modal-close">Close</button>' }); },
    'chat-send': async () => {
      const inp = $('#chatIn'); const t = inp.value.trim(); if (!t) return; const key = inp.dataset.key;
      if (IS_DEMO) { pushChat(key, true, t); inp.value = ''; renderChat(key); return; }
      if (!((key.indexOf('i:') === 0 && S.inspectionsLive) || (key.indexOf('b:') === 0 && S.bookingsLive))) return Api.need();
      const leak = chatLeak(t); if (leak) return toast('Sharing ' + leak + ' in chat is not allowed. Keep payments and contact on MainTown.');
      inp.value = '';
      try {
        const r = await sb.rpc('chat_send', { p_entity: chatEntity(key), p_body: t, p_cid: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) });
        if (r.error) throw r.error;
        await loadChat(key);
      } catch (e) { inp.value = t; toast('Could not send: ' + (e && e.message || 'try again')); }
    },
    'toggle-bd': id => { const e = $('#bd-' + id); if (e) e.classList.toggle('open'); },
    withdraw: () => { if (!IS_DEMO && !S.profile.payoutAcct) { toast('Add your payout bank account first.'); return ACT['bank-open'](); } modal({ title: 'Withdraw to bank', sub: 'Goes to ' + (S.profile.bank || 'your payout account') + ' instantly.', body: '<label class="fld">Amount (₦)<input class="in mono" id="wAmt" inputmode="numeric" placeholder="Up to ' + Math.round(S.wallet.balance).toLocaleString() + '"></label><p style="color:var(--faint);font-size:12px;margin:10px 0 0">Available: ' + money(S.wallet.balance) + '</p>', foot: '<button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" data-act="withdraw-ok">Withdraw</button>' }); },
    'withdraw-ok': () => { const a = Number(($('#wAmt').value || '').replace(/[^\d]/g, '')); if (!a || a > S.wallet.balance) return toast('Enter an amount within your balance.'); if (!Api.need()) return; S.wallet.balance -= a; S.wallet.entries.push({ id: 'W' + Date.now(), label: 'Withdrawal to bank', amount: a, ts: Date.now(), dir: 'out' }); closeModal(); toast(money(a) + ' sent to your bank.'); rerender(); },
    'sign-open': id => { const a = S.assets.find(x => x.id === id); modal({ title: 'Countersign the Contract of Sale', sub: a.title + ' · ' + a.buyer, body: '<p style="color:var(--muted);margin:0 0 12px">Type your full legal name to sign. This is legally binding and is recorded with the date and time.</p><label class="fld">Full legal name<input class="in" id="sigName" placeholder="' + esc(S.profile.name) + '"></label>', foot: '<button class="btn" data-act="modal-close">Later</button><button class="btn primary" data-act="sign-ok" data-id="' + id + '">Sign contract</button>' }); },
    'sign-ok': id => { const n = $('#sigName').value.trim(); if (n.length < 3) return toast('Type your full name to sign.'); const a = S.assets.find(x => x.id === id); if (!IS_DEMO) { return (async () => { try { const r = await sb.rpc('dashboard_countersign_handover', { p_id: (a && a.hid) || id, p_name: n }); if (r.error) throw r.error; closeModal(); toast('Contract signed. The buyer is notified in the app.'); await Api.load(); rerender(); } catch (e) { toast((e && e.message) || 'Could not sign. Please try again.'); } })(); } a.countersigned = true; addNotif('Contract countersigned', a.title + ' is now fully executed. You can request title document dispatch.', 'assets'); closeModal(); toast('Contract signed.'); rerender(); },
    'dl-agreement': id => { const a = S.assets.find(x => x.id === id); const txt = 'CONTRACT OF SALE (sample)\n\nProperty: ' + a.title + '\nBuyer: ' + a.buyer + '\nPrice: ' + money(a.price) + '\n\nThis is a sample file from the dashboard preview.'; const u = URL.createObjectURL(new Blob([txt], { type: 'text/plain' })); const l = document.createElement('a'); l.href = u; l.download = 'contract-of-sale.txt'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 500); },
    dispatch: id => { const a = S.assets.find(x => x.id === id); modal({ title: 'Request title document pick-up', sub: 'Free dispatch by SmartyHub Logistics', body: '<div class="f"><label class="fld">Pick-up location<input class="in" id="dpFrom" placeholder="Where the documents are"></label><label class="fld">Delivery location<input class="in" id="dpTo" placeholder="Buyer’s delivery address"></label><label class="fld">Pick-up contact phone<input class="in" id="dpPhone" type="tel"></label><label class="fld">Delivery contact phone<input class="in" id="dpPhone2" type="tel"></label></div><p style="color:var(--faint);font-size:12px;margin:12px 0 0">Pick-up happens within 24 to 48 hours of your request.</p>', foot: '<button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" data-act="dispatch-ok" data-id="' + id + '">Request pick-up</button>' }); },
    'dispatch-ok': async id => {
      const from = $('#dpFrom').value.trim(), to = $('#dpTo').value.trim(), ph = $('#dpPhone').value, ph2 = ($('#dpPhone2') || { value: ph }).value;
      if (from.length < 5 || to.length < 5 || ph.replace(/\D/g, '').length < 10 || ph2.replace(/\D/g, '').length < 10) return toast('Fill in both locations and a phone number for each.');
      const a = S.assets.find(x => x.id === id);
      if (IS_DEMO) { a.dispatch = 'requested'; closeModal(); toast('Requested. Pick-up within 24 to 48 hours.'); rerender(); return; }
      try { const r = await sb.rpc('dashboard_request_dispatch', { p_asset: String(id), p_pickup: from, p_delivery: to, p_pickup_phone: ph, p_delivery_phone: ph2 }); if (r.error) throw r.error; closeModal(); toast('Requested. Pick-up within 24 to 48 hours. The buyer is told in the app.'); await Api.load(); rerender(); }
      catch (e) { toast((e && e.message) || 'Could not send the request.'); }
    },
    'offer-accept': id => { if (!Api.need()) return; const o = S.offers.find(x => x.id === id); o.status = 'Accepted'; addNotif('Offer accepted', o.buyer + ' can now pay ' + money(o.offer) + '.', 'deals'); toast('Offer accepted.'); rerender(); },
    'offer-decline': id => { if (!Api.need()) return; S.offers.find(x => x.id === id).status = 'Declined'; toast('Offer declined.'); rerender(); },
    'offer-counter': id => { const o = S.offers.find(x => x.id === id); modal({ title: 'Counter offer', sub: o.listingTitle, body: '<label class="fld">Your price (₦)<input class="in mono" id="cAmt" inputmode="numeric" placeholder="Between ' + money(o.offer) + ' and ' + money(o.ask) + '"></label>', foot: '<button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" data-act="offer-counter-ok" data-id="' + id + '">Send counter</button>' }); },
    'offer-counter-ok': id => { const o = S.offers.find(x => x.id === id), a = Number($('#cAmt').value.replace(/[^\d]/g, '')); if (!a || a < o.offer || a > o.ask) return toast('Counter must sit between the offer and the asking price.'); if (!Api.need()) return; o.status = 'Countered'; o.counter = a; closeModal(); toast('Counter sent.'); rerender(); },
    notif: id => { const n = S.notifications.find(x => x.id === id); if (!n) return; if (n.unread && n.real) { try { sb.rpc('mark_notifications_read', { p_ids: [n.id] }); } catch (e) {} } n.unread = false; const dest = n.route || 'overview', same = (location.hash || '#/overview') === '#/' + dest; if (same) rerender(); else go(dest); refreshNav(); },
    'gate-next': () => { const g = GATE; g.bank = $('#gBank').value.trim(); g.acct = $('#gAcct').value.replace(/\D/g, ''); g.bvn = $('#gBvn').value.replace(/\D/g, ''); g.nin = !!($('#gNin').files && $('#gNin').files[0]) || g.nin; g.selfie = !!($('#gSelfie').files && $('#gSelfie').files[0]) || g.selfie;
      if (!g.nin) return toast('Upload your National ID or NIN slip.'); if (!g.selfie) return toast('Add a selfie.'); if (g.bank.length < 2 || g.acct.length !== 10) return toast('Enter your bank name and 10-digit account number.'); if (g.bvn.length !== 11) return toast('Enter your 11-digit BVN or NIN.');
      g.step = 2; rerender(); },
    'gate-back': () => { GATE.step = 1; rerender(); },
    'gate-finish': () => { if (!$('#gAgree').checked) return toast('Tick the box to sign off on the policy.'); if (!Api.need()) return; S.profile.activated = true; S.profile.bank = GATE.bank + ' •• ' + GATE.acct.slice(-4); S.profile.kyc = 'Verified'; GATE.bvn = ''; toast('Account activated.'); renderChrome(); rerender(); }
  };

  function openChat(key, who, about) {
    markSeen(key); setTimeout(refreshNav, 0);
    modal({ title: who, sub: about, body: '<div class="chat" id="chatBox"></div><div style="display:flex;gap:8px;margin-top:6px"><input class="in" style="margin:0" id="chatIn" data-key="' + key + '" placeholder="Write a message"><button class="btn primary" data-act="chat-send">Send</button></div>' });
    renderChat(key);
    if (!IS_DEMO && ((key.indexOf('i:') === 0 && S.inspectionsLive) || (key.indexOf('b:') === 0 && S.bookingsLive))) {
      const note = document.createElement('div'); note.className = 'notice'; note.style.margin = '8px 0 0';
      note.innerHTML = ico('phone') + '<div>Messages here and in the app are the same conversation. Voice and video calls are available in the app.</div>';
      $('#chatBox').after(note);
      loadChat(key); clearInterval(CHAT_POLL); CHAT_POLL = setInterval(() => { if ($('#chatBox')) loadChat(key); else clearInterval(CHAT_POLL); }, 8000);
    }
    const inp = $('#chatIn'); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ACT['chat-send'](); } });
  }
  let CHAT_POLL = null;
  const chatEntity = key => key.indexOf('b:') === 0 ? 'sl:' + key.slice(2) : key.slice(2);
  function chatLeak(text) {
    const t = String(text || '').toLowerCase(), stripped = t.replace(/[\s\-.()]/g, '');
    if (/(\+?234|0)[789][01]\d{8}/.test(stripped)) return 'phone numbers';
    if (/[\w.+-]+@[\w-]+\.[a-z]{2,}/.test(t)) return 'email addresses';
    if (/(https?:\/\/|www\.|wa\.me|t\.me|bit\.ly)/.test(t)) return 'links';
    if (/(account|acct|bank|transfer|pay me|send money)/.test(t) && /\b\d{10}\b/.test(t)) return 'bank account details';
    return null;
  }
  async function loadChat(key) {
    try {
      const r = await sb.rpc('chat_pull', { p_entity: chatEntity(key) });
      if (r.error) throw r.error;
      S.chats[key] = (r.data || []).map(m => ({ me: !!m.mine, t: m.body, ts: new Date(m.created_at).getTime() }));
      if ($('#chatBox')) markSeen(key);
      renderChat(key);
    } catch (e) {}
  }
  function renderChat(key) {
    const msgs = S.chats[key] || S.chats[key.slice(2)] || [];
    const box = $('#chatBox'); if (!box) return;
    box.innerHTML = msgs.length ? msgs.map(m => '<div class="bub ' + (m.me ? 'me' : '') + '">' + esc(m.t) + '<small>' + fmtTime(m.ts || Date.now()) + '</small></div>').join('') : '<div class="empty" style="padding:20px">No messages yet. Say hello.</div>';
    box.scrollTop = box.scrollHeight;
  }

  document.addEventListener('click', e => {
    const t = e.target;
    const menu = $('#acctMenu');
    if (t.closest('#avBtn')) { menu.classList.toggle('hidden'); return; }
    if (menu && !menu.classList.contains('hidden') && !t.closest('#acctMenu')) menu.classList.add('hidden');
    if (t.closest('#menuBtn')) { document.body.classList.toggle('nav-open'); return; }
    if (t.closest('#scrim') || t.closest('.nav a')) document.body.classList.remove('nav-open');
    if (t.closest('#bellBtn')) { go('notifications'); return; }
    if (t.closest('#signOutBtn')) { (async () => { try { await sb.auth.signOut(); } catch (e) {} try { localStorage.removeItem(MEMBER_CACHE); } catch (e) {} location.href = './index.html'; })(); return; }
    const goEl = t.closest('[data-go]'); if (goEl) { menu && menu.classList.add('hidden'); go(goEl.dataset.go); return; }
    const tab = t.closest('[data-tab]'); if (tab) { const [k, v] = tab.dataset.tab.split(':'); TAB[k] = v; rerender(); return; }
    const m = t.closest('#modal'); if (m && t.id === 'modal' ) { closeModal(); return; }
    const cat = t.closest('[data-lf-cat]'); if (cat) { LF.cat = cat.dataset.lfCat; document.querySelectorAll('#lfCat button').forEach(b => b.classList.toggle('on', b === cat)); $('#lfEventNote').classList.toggle('hidden', LF.cat !== 'event'); dynFields(); return; }
    const kind = t.closest('[data-lf-kind]'); if (kind) { LF.kind = kind.dataset.lfKind; dynFields(); return; }
    const mode = t.closest('[data-lf-mode]'); if (mode) { document.querySelectorAll('#lfMode button').forEach(b => b.classList.toggle('on', b === mode)); return; }
    const a = t.closest('[data-act]'); if (!a || a.disabled) return;
    const fn = ACT[a.dataset.act]; if (fn) fn(a.dataset.id, a);
  });
  document.addEventListener('change', e => { if (e.target.id === 'lfInst') $('#lfInstWrap').style.display = e.target.checked ? '' : 'none'; if (e.target.id === 'lfState') fillCities(); if (e.target.id === 'lfCity') fillAreas(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  boot();
})();
</script>
